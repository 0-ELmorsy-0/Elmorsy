name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Backend
      run: |
        cd backend
        chmod +x gradlew
        ./gradlew build -x test

    - name: Run Backend Tests
      run: |
        cd backend
        ./gradlew test

    - name: Build Android App
      run: |
        cd android-app
        chmod +x gradlew
        ./gradlew build -x test

    - name: Run Android Tests
      run: |
        cd android-app
        ./gradlew test

    - name: Build APK
      run: |
        cd android-app
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: android-app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload Backend Build
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-build
        path: backend/build/
        retention-days: 30

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          backend/build/reports/
          android-app/build/reports/
        retention-days: 30

    - name: Create Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.0-build-${{ github.run_number }}
        release_name: Release v1.0.0 Build ${{ github.run_number }}
        body: |
          ## Nursing Admin Dashboard Build
          - Backend: Spring Boot + Kotlin
          - Android: Jetpack Compose
          - Build Number: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        draft: false
        prerelease: false
