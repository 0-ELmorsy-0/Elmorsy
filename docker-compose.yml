version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nursing_admin_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nursing_admin
      MYSQL_USER: nursing_admin
      MYSQL_PASSWORD: nursing_admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nursing_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nursing_admin_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - nursing_network

volumes:
  mysql_data:

networks:
  nursing_network:
    driver: bridge
