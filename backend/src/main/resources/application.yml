spring:
  application:
    name: nursing-admin-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/nursing_admin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

server:
  port: 8080
  servlet:
    context-path: /api
  
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: "your-secret-key-change-this-in-production-environment-please-make-it-long-and-secure"
  expiration: 86400000

logging:
  level:
    root: INFO
    com.nursing.admin: DEBUG
